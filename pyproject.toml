[project]
name = "divergence-aware-digital-twin"
version = "0.1.0"
description = "Research prototype for divergence-aware runtime assurance in AI-driven logistics Digital Twins."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "simpy>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dara_dt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[dependency-groups]
dev = [
    "pytest>=8.0",
]
