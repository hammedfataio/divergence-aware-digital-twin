name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run test suite
        run: uv run pytest -v

      - name: Run B-vs-C pilot experiment
        run: uv run python -m dara_dt.experiments.run_pilot

      - name: Run controlled experimental matrix
        run: uv run python -m dara_dt.experiments.run_matrix

      - name: Run aggregate matrix metrics
        run: uv run python -m dara_dt.experiments.run_metrics
